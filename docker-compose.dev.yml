version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncbridge_dev_backend
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/dev.db
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: syncbridge_dev_redis
    ports:
      - "6379:6379"
