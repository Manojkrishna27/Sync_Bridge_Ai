

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - web
    networks:
      - ai-network

  api:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend:/app
    networks:
      - ai-network

  web:
    build: 
      context: ./frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ai-network

  worker:
    build: 
      context: ./backend
    command: celery -A app.tasks worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - api
      - redis
      - mysql
    volumes:
      - ./backend:/app
    networks:
      - ai-network

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_gateway
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/seeds:/docker-entrypoint-initdb.d
    networks:
      - ai-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - ai-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-network

volumes:
  mysql_data:
  qdrant_data:

networks:
  ai-network:
    driver: bridge
